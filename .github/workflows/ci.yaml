name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  static-code-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that current year is included in copyright statement in LICENSE-MIT
        env:
          LC_ALL: C.UTF-8
        run: |
          grep -q "^Copyright[[:space:]][[:space:],0-9-]*$(date +%Y)[[:space:]]" LICENSE-MIT
      - name: Check spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f # v1.49.0
        with:
          config: .typos.toml
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run check:formatting
      - name: Lint
        run: pnpm run check:lint
      - name: Check Markdown
        run: pnpm run check:markdown
