name: Continuous integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

env:
  FORCE_COLOR: "1"

jobs:
  static-code-analysis:
    name: Static code analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check that current year is included in copyright statement in LICENSE-MIT
        env:
          LC_ALL: C.UTF-8
        run: |
          grep -q "^Copyright[[:space:]][[:space:],0-9-]*$(date +%Y)[[:space:]]" LICENSE-MIT
      - name: Check spelling
        uses: crate-ci/typos@d43b6c087ac471e2ea7b8af622ff15f05c0c365b # v1.50.1
        with:
          config: .typos.toml
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm run check:formatting
      - name: Lint
        run: pnpm run check:lint
      - name: Check Markdown
        run: pnpm run check:markdown
